name = "catur-online"
main = "server/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./client"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyDO", "RoomDO"]

[observability]
enabled = true
